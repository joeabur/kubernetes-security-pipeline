apiVersion: v1
kind: ServiceAccount
metadata:
  name: secure-demo-api
  namespace: security-demo
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-demo-api
  namespace: security-demo
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-demo-api
    spec:
      serviceAccountName: secure-demo-api
      automountServiceAccountToken: false
      securityContext:
{{ toYaml .Values.securityContext | indent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
{{ toYaml .Values.containerSecurityContext | indent 12 }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: secure-demo-api
  namespace: security-demo
spec:
  selector:
    app.kubernetes.io/name: secure-demo-api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
