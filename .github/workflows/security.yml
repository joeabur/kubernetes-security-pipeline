name: Security Pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  SECURITY_THRESHOLD: HIGH
  IMAGE: secure-demo-api:${{ github.sha }}

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/python
            p/security-audit
            p/dockerfile
          generateSarif: true
          auditOn: push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif

  sca-and-secrets:
    name: SCA and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SCA with Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: fs
          scanners: vuln,secret
          format: sarif
          output: reports/trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-secret-reports
          path: reports/

  iac-and-kubernetes:
    name: IaC and Kubernetes security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkov
        uses: bridgecrewio/checkov-action@a8664e3a0549367977f0cda990a34311835c87c0 # master
        with:
          directory: kubernetes/base
          framework: kubernetes
          output_format: sarif
          output_file_path: reports/checkov.sarif
          soft_fail: false
      - name: Trivy Kubernetes misconfiguration scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: kubernetes/base
          format: sarif
          output: reports/trivy-kubernetes.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Trivy Helm misconfiguration scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: helm/secure-demo-api
          format: sarif
          output: reports/trivy-helm.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Kyverno policy tests
        uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289 # v0.2.0
      - run: kyverno apply policies/kyverno --resource kubernetes/base --table
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iac-kubernetes-reports
          path: reports/

  container:
    name: Container scan and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build --file docker/Dockerfile --tag "$IMAGE" .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: reports/trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}
          format: cyclonedx-json
          output-file: reports/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-reports
          path: reports/

  gate:
    name: Security gate
    needs: [sast, sca-and-secrets, iac-and-kubernetes, container]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce upstream checks
        run: |
          test "${{ needs.sast.result }}" = success
          test "${{ needs.sca-and-secrets.result }}" = success
          test "${{ needs.iac-and-kubernetes.result }}" = success
          test "${{ needs.container.result }}" = success
