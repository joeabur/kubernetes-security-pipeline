apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-demo-api
  namespace: security-demo
  labels:
    app.kubernetes.io/name: secure-demo-api
  annotations:
    checkov.io/skip1: CKV2_K8S_6=NetworkPolicy is composed as a sibling resource by Kustomize.
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-demo-api
    spec:
      serviceAccountName: secure-demo-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/example/secure-demo-api:0.1.0@sha256:REPLACE_WITH_RELEASE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
