# EDUCATIONAL NEGATIVE FIXTURE: never deploy outside an isolated lab.
apiVersion: v1
kind: Secret
metadata:
  name: plaintext-demo-secret
  namespace: security-demo
stringData:
  password: "demo-only-not-a-real-secret"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: overly-powerful
  namespace: security-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: overly-powerful-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: overly-powerful
    namespace: security-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-demo
  namespace: security-demo
spec:
  selector:
    matchLabels: {app: vulnerable-demo}
  template:
    metadata:
      labels: {app: vulnerable-demo}
    spec:
      hostNetwork: true
      serviceAccountName: overly-powerful
      containers:
        - name: vulnerable
          image: nginx:latest
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
            capabilities:
              add: [SYS_ADMIN, NET_RAW]
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
